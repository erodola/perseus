# Every PR is checked before a maintainer is notified: speedrun/harness/check_pr.py (the speedrun's harness, rules and
# records left alone; for an entry, its record folder, submission.json, the declared CKKS parameters at 128-bit security
# and the client's code). It runs the base branch's checker and reads the PR through git only, so no submitted code runs
# here; the PR's description reaches it as a file. A plain PR that passes gets no comment. An entry that passes is
# labelled `checked` and its review requested; a failure is labelled `check-failed` and explained in a comment.
name: Speedrun PR check
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the PR without running it
        run: git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
      - name: Check
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > body.md
          if python3 speedrun/harness/check_pr.py --base "${{ github.event.pull_request.base.sha }}" --head pr-head \
               --author "$AUTHOR" --body body.md > report.md
          then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          cat report.md
      - name: Report and notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -s report.md ] || exit 0
          gh label create checked --color 0e8a16 --force >/dev/null
          gh label create check-failed --color d93f0b --force >/dev/null
          gh pr comment "$PR" --edit-last --body-file report.md || gh pr comment "$PR" --body-file report.md
          if [ "${{ steps.check.outputs.ok }}" = 1 ]; then
            gh pr edit "$PR" --add-label checked --remove-label check-failed
            gh pr edit "$PR" --add-reviewer alexzilligmm || true
          else
            gh pr edit "$PR" --add-label check-failed --remove-label checked
            exit 1
          fi
