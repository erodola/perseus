<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encrypted GPT-2 Speedrun records</title>
<style>
:root{color-scheme:light dark;--text:#24292f;--muted:#59636e;--grid:#d1d9e0;--line:#3d5a80;--bg:#ffffff}
@media (prefers-color-scheme:dark){:root{--text:#e6edf3;--muted:#9198a1;--grid:#3d444d;--line:#98c1d9;--bg:#0d1117}}
body{margin:0;padding:24px max(16px,4vw);background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
h1{font-size:20px;margin:0 0 4px} p{color:var(--muted);margin:0 0 16px}
svg{width:100%;max-width:900px;height:auto;overflow:visible}
.t{fill:var(--text)}.m{fill:var(--muted)}.g{stroke:var(--grid)}
.ln{fill:none;stroke:var(--line);stroke-width:2.5}
.hold{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 4;opacity:.55}
.pt{fill:var(--line);stroke:var(--line);stroke-width:2.5;cursor:pointer}
.bar{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:1.5 3}
.pt:hover,.pt:focus{stroke-width:4;outline:none}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:6px;
font-size:12.5px;line-height:1.4;max-width:280px}
</style></head><body>
<h1>Encrypted GPT-2 Speedrun records</h1>
<p>Hover or focus a point for details.</p>

/title></circle><text class="t" x="200.0" y="148.8" font-size="12">#1 · 22.22 s</text><text class="t" x="52" y="328" font-size="15" font-weight="600">GPT-2 Decode-8</text><text class="m" x="52" y="346" font-size="12">time per token (s/token), log scale</text><line class="g" x1="52" x2="880" y1="520.0" y2="520.0"/><text class="m" x="44" y="524.0" font-size="11" text-anchor="end">1</text><line class="g" x1="52" x2="880" y1="471.2" y2="471.2"/><text class="m" x="44" y="475.2" font-size="11" text-anchor="end">2</text><line class="g" x1="52" x2="880" y1="406.8" y2="406.8"/><text class="m" x="44" y="410.8" font-size="11" text-anchor="end">5</text><line class="g" x1="52" x2="880" y1="358.0" y2="358.0"/><text class="m" x="44" y="362.0" font-size="11" text-anchor="end">10</text><text class="m" x="328.0" y="580" font-size="11" text-anchor="middle">Nov 2026</text><text class="m" x="742.0" y="580" font-size="11" text-anchor="middle">Dec</text><line class="g" x1="52" x2="880" y1="560" y2="560"/><line class="bar" x1="52" x2="880" y1="520.0" y2="520.0"/><text class="m" x="880" y="515.0" font-size="11" text-anchor="end">1 token/s</text><line class="bar" x1="52" x2="880" y1="553.0" y2="553.0"/><text class="m" x="880" y="548.0" font-size="11" text-anchor="end">GPT-2 unencrypted: 0.65 ms/token (1,536 tokens/s)</text><path class="ln" d="M190.0,422.6H190.0V434.2H217.6V442.0"/><path class="hold" d="M217.6,442.0H880"/><circle class="pt" cx="190.0" cy="422.6" r="5" tabindex="0" data-tip="{&quot;title&quot;: &quot;#0 Perseus (FIDESlib)&quot;, &quot;value&quot;: &quot;3.993 s/token&quot;, &quot;date&quot;: &quot;2026-10-22&quot;}"><title>#0 Perseus (FIDESlib), 3.993 s/token, 2026-10-22</title></circle><text class="t" x="200.0" y="413.6" font-size="12">#0 · 3.993 s/token</text><circle class="pt" cx="190.0" cy="434.2" r="5" tabindex="0" data-tip="{&quot;title&quot;: &quot;#1 Perseus on perseus-core&quot;, &quot;value&quot;: &quot;3.384 s/token&quot;, &quot;date&quot;: &quot;2026-10-22&quot;}"><title>#1 Perseus on perseus-core, 3.384 s/token, 2026-10-22</title></circle><text class="t" x="200.0" y="452.2" font-size="12">#1 · 3.384 s/token</text><circle class="pt" cx="217.6" cy="442.0" r="5" tabindex="0" data-tip="{&quot;title&quot;: &quot;#2 FusedUnits&quot;, &quot;value&quot;: &quot;3.031 s/token&quot;, &quot;date&quot;: &quot;2026-10-24&quot;}"><title>#2 FusedUnits, 3.031 s/token, 2026-10-24</title></circle><text class="t" x="227.6" y="433.0" font-size="12">#2 · 3.031 s/token</text></svg>
<div id="tip" hidden></div>
<script>
const tip = document.getElementById("tip");
function show(e) {
  const d = JSON.parse(e.target.dataset.tip), r = e.target.getBoundingClientRect();
  tip.innerHTML = "<b></b><br><span></span>";
  tip.querySelector("b").textContent = d.title;
  tip.querySelector("span").textContent = d.value + " \u00b7 " + d.date;
  tip.hidden = false;
  tip.style.left = Math.min(r.right + 10, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (r.top - tip.offsetHeight - 6) + "px";
}
for (const p of document.querySelectorAll(".pt")) {
  p.querySelector("title").remove();
  p.addEventListener("mouseenter", show); p.addEventListener("focus", show);
  p.addEventListener("mouseleave", () => tip.hidden = true); p.addEventListener("blur", () => tip.hidden = true);
}
</script></body></html>
